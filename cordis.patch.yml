# The archive manager bundle patch: one host row carrying both halves.
#
# `dsh.client` in package.json is what turns this same row into the browser
# half as well — the client-modules node half scans enabled Loader entries,
# finds the declaration on this package, and serves lib/client.js.
#
# The row names its own entry file, patch-relative: app-boot converts a `./`
# path to a file URL against this file. That keeps the row independent of how
# the enclosing package is linked into the profile — including the first
# install into an already-running app, where a bare package specifier can be
# resolved before pnpm's link exists and Node then caches that miss.
#
# No `disabled` expression, on purpose. The loader evaluates such an expression
# while it builds the entry tree — before any plugin has applied — so it can only
# read services that already exist at that moment (app-boot's own, such as
# `profileContext`). Probing a plugin-provided service like `webServer` therefore
# evaluates to disabled on every cold start and never recovers, because `refresh()`
# returns early for a disabled entry until the tree is rebuilt.
# Nothing is lost by dropping the gate: the host half injects the web surface
# optionally, so a profile without a webserver activates the row and simply
# registers no route.
- insert:
    - id: desktop-archive-manager
      name: "./lib/host.js"
